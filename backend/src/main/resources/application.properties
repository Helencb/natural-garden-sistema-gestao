spring.application.name=backend
# ============================================
# Natural Garden - Backend (Spring Boot)
# Valores lidos de variaveis de ambiente, com fallback para desenvolvimento local.
# ============================================

server.port=${SERVER_PORT:8080}

# Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:natural_garden_db}?useTimezone=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Autenticacao JWT
jwt.secret=${JWT_SECRET:troque-por-uma-chave-secreta-longa-e-aleatoria}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}